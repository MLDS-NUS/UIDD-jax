# Default config file for the nonlinear case

temperature: 1
dt: 0.005
dim: 2 # state dimension
Model_name: HD2
data:
  seed: 123 # random seed
  init_min: [-2.5, -1.5] # lower corner of the initial-condition box
  init_max: [2.5, 1.5] # upper corner of the initial-condition box
  var: 0.8 # circulation strength kappa
  t0: 0.0
  t1: 0.5
  num_runs: 9000 # number of training trajectories
  num_runs_test: 1000 # number of test trajectories

model:
  seed: 0
  potential:
    alpha: 0.01 # regularization strength
    units: # layer sizes
      - 64
      - 32
    activation: "recu"
    l2_weight: 0.01 # L2 regularization strength only used for OnsagerReg
    sobolev_weight: 0.0 # Sobolev regularization strength only used for OnsagerReg
  hamiltonian:
    # units:
    #   - 128
    # activation: "tanh"
    units:
      - 32
      - 16
    activation: "recu"
    is_bounded: false
  dissipation:
    alpha: 0.1
    units:
      - 32
      - 16
    activation: "recu"
    is_bounded: false # whether to have the output bounded (via tanh activation)
  conservation:
    units:
      - 32
      - 16
    activation: "recu"
    is_bounded: false
  drift:
    units:
      - 128
      - 128
    activation: "tanh"
  diffusion:
    alpha: 0.1
    units:
      - 32
      - 16
    activation: "recu"
  

train:
  num_epochs: 3000
  batch_size: 100000 # each batch will be [batch_size, train_traj_len, dim], so use a small batch size if train_traj_len is large
  train_traj_len: 2 # can shrink the length of the training trajectories for better GPU performance
  checkpoint_every: 200 # number of epochs to check-point the model
  print_every: 200 # number of epochs to print the loss
  opt: # optimiser options
    learning_rate: 1e-3
  rop: # reduce on plateau options
    patience: 20
    cooldown: 20
    factor: 0.4
    rtol: 1e-4
    min_scale: 1e-4
    accumulation_size: 2000

hydra:
  run:
    dir: ./outputs/nonlinear${model.seed}_${Model_name}_dt${dt}
  sweep:
    dir: ./outputs/multirun/${now:%Y_%m_%d-%H_%M_%S}
    subdir: ${hydra.job.num}
